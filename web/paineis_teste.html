<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Teste dos painéis</title>
<link rel="stylesheet" href="fonts/fonts.css">
<link rel="stylesheet" href="paineis.css">
<style>
  html, body { margin: 0; width: 1920px; height: 1080px; background: #000; overflow: hidden; font-family: 'Archivo', system-ui, sans-serif; }
  /* casca de teste: imita a casca <section class="panel"> escura do deck */
  .panel { position: absolute; inset: 0; background: #050914; display: flex; flex-direction: column; gap: 36px; padding: 90px 130px; overflow-y: auto; overscroll-behavior: contain; }
  .panel::-webkit-scrollbar { width: 0; }
  .fim { position: absolute; left: 0; right: 0; bottom: 0; height: 6px; background: #E6EEFB; opacity: .0; }
  .medida { position: fixed; right: 12px; top: 8px; font: 18px Archivo, sans-serif; color: #6F8FC7; z-index: 9; }
</style>
</head>
<body>
<section class="panel" id="casca"></section>
<div class="medida" id="medida"></div>
<script src="fontes.js"></script>
<script src="paineis.js"></script>
<script>
  var id = new URLSearchParams(location.search).get('painel');
  var ids = Object.keys(window.HNV_PANELS);
  if (!id) id = ids[0];
  document.getElementById('casca').innerHTML = window.HNV_PANELS[id] || ('<p style="color:#fff">painel inexistente: ' + id + '</p>');
  document.querySelectorAll('.fonte').forEach(function (b) { b.addEventListener('click', function () { document.getElementById('medida').textContent = 'fonte: ' + b.dataset.src; }); });
  // mede o excesso de altura do painel
  window.addEventListener('load', function () {
    var c = document.getElementById('casca');
    document.getElementById('medida').textContent = id + ' · altura do conteúdo ' + c.scrollHeight + ' / 1080';
    document.documentElement.setAttribute('data-h', c.scrollHeight);
  });
</script>
</body>
</html>
